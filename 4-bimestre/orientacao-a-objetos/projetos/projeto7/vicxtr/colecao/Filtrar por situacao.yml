info:
  name: Filtrar por situacao
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/sessoes?situacao=confirmada
  params:
    - name: situacao
      value: confirmada
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
