info:
  name: Aplicar dois filtros
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/sessoes?situacao=confirmada&horasMin=8
  params:
    - name: situacao
      value: confirmada
      type: query
    - name: horasMin
      value: "8"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
